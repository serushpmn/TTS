<!doctype html>
<html lang="en" data-theme="mono" data-mode="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local multi-speaker dialogue TTS with Kokoro" />
    <title>Dialogue Studio</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("dialogue-studio-theme") || "mono";
          const mode = localStorage.getItem("dialogue-studio-mode") === "night" ? "night" : "day";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-mode", mode);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
